name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: bepusdt

jobs:
  checks:
    name: Code and Docker checks
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile --shamefully-hoist

      - name: Lint frontend
        working-directory: ./web
        run: pnpm exec eslint src

      - name: Type-check and build frontend
        working-directory: ./web
        run: pnpm run build:prod

      - name: Move frontend files to static/secure
        shell: bash
        run: |
          rm -rf static/secure
          mkdir -p static/secure
          cp -a web/dist/. static/secure/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Test Go code
        run: go test -count=1 ./...

      - name: Vet Go code
        run: go vet ./...

      - name: Set Docker image version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          echo "VERSION_TAG=ci-${version}-${short_sha}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION_TAG }}
          tags: ${{ env.APP_NAME }}:${{ env.VERSION_TAG }}
